spring:
  application:
    name: lczz-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lczz_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:lczz_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"

lczz:
  jwt:
    issuer: ${JWT_ISSUER:lczz}
    secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}
  file:
    storage-type: ${FILE_STORAGE_TYPE:LOCAL}
    local-root: ${FILE_LOCAL_ROOT:./data/uploads}
