spring:
  application:
    name: lczz-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lczz_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:lczz_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:200MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:205MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"

lczz:
  jwt:
    issuer: ${JWT_ISSUER:lczz}
    secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}
  wechat:
    mini:
      app-id: ${WECHAT_MINI_APP_ID:}
      app-secret: ${WECHAT_MINI_APP_SECRET:}
  bootstrap-admin:
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    nickname: ${ADMIN_BOOTSTRAP_NICKNAME:系统管理员}
  dev-auth:
    enabled: ${DEV_AUTH_ENABLED:false}
    password: ${DEV_AUTH_PASSWORD:}
  file:
    storage-type: ${FILE_STORAGE_TYPE:LOCAL}
    local-root: ${FILE_LOCAL_ROOT:./data/uploads}
    max-bytes: ${FILE_MAX_BYTES:209715200}
    max-image-bytes: ${FILE_MAX_IMAGE_BYTES:10485760}
    signed-url-minutes: ${FILE_SIGNED_URL_MINUTES:5}
    access-secret: ${FILE_ACCESS_SECRET:${JWT_SECRET:}}
